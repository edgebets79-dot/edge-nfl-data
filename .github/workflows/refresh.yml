name: Refresh nflverse data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"
  push:
    branches:
      - main
    paths:
      - "build_data.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Edge nflverse data
        run: python build_data.py

      - name: Save refreshed files
        run: |
          git config user.name "edge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Refresh nflverse player data"
          git push
