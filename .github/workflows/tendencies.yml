name: Build tendencies

on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC daily (after nflverse's overnight updates and the existing 10:20 data refresh)
    - cron: "0 11 * * *"
  push:
    branches: [main]
    paths:
      - build_tendencies.py
      - data/playcallers.csv
      - .github/workflows/tendencies.yml

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.1" "numpy>=1.26"

      - name: Build tendency tables
        run: python build_tendencies.py --cache .cache

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tendencies
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update tendencies $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
